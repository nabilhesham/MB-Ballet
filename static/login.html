<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MB Pallete Academy</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
  .card{width:100%;max-width:380px}
  .logo{text-align:center;margin-bottom:26px}
  .logo .mark{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--brand)}
  .logo .name{font-size:26px;font-weight:600;margin-top:8px}
  .box{padding:28px;border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .err{color:var(--bad);font-size:12.5px;margin-top:14px;min-height:18px}
  button[type=submit]{width:100%;margin-top:20px;padding:12px}
  .hint{text-align:center;color:var(--dim);font-size:11.5px;margin-top:22px;line-height:1.7}
  .logo .name{font-family:var(--serif)}
  button[type=submit]{justify-content:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="mark">ACADEMY</div>
    <div class="name">MB Pallete</div>
  </div>

  <div class="box">
    <div id="stepLogin">
      <label>USERNAME</label>
      <input id="u" autocomplete="username" autofocus>
      <label>PASSWORD</label>
      <input id="p" type="password" autocomplete="current-password">
      <div class="err" id="err"></div>
      <button class="pri" type="submit" id="go">Sign in</button>
    </div>

    <div id="stepChange" style="display:none">
      <h3 style="margin:0 0 6px;font-size:17px">Choose a new password</h3>
      <div class="sub" style="margin-bottom:6px">This account still has its setup password.</div>
      <label>NEW PASSWORD</label>
      <input id="np" type="password" autocomplete="new-password">
      <label>REPEAT</label>
      <input id="np2" type="password" autocomplete="new-password">
      <div class="err" id="err2"></div>
      <button class="pri" type="submit" id="go2">Save and continue</button>
    </div>
  </div>

  <div class="hint">Runs on this laptop only.<br>Ask an admin if you need an account.</div>
</div>

<script>
const $ = id => document.getElementById(id);

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail || 'Something went wrong');
  return d;
}

async function signIn(){
  $('err').textContent = '';
  const btn = $('go'); btn.disabled = true;
  try{
    const d = await post('/api/auth/login', {username:$('u').value, password:$('p').value});
    if(d.user.must_change){
      $('stepLogin').style.display = 'none';
      $('stepChange').style.display = 'block';
      $('np').focus();
    } else location.href = '/';
  }catch(e){ $('err').textContent = e.message; btn.disabled = false; $('p').select(); }
}

async function changePw(){
  $('err2').textContent = '';
  if($('np').value !== $('np2').value){ $('err2').textContent = 'The two entries do not match'; return; }
  const btn = $('go2'); btn.disabled = true;
  try{
    await post('/api/auth/password', {new_password:$('np').value});
    // set_password clears sessions, so sign in again with the new one.
    await post('/api/auth/login', {username:$('u').value, password:$('np').value});
    location.href = '/';
  }catch(e){ $('err2').textContent = e.message; btn.disabled = false; }
}

$('go').onclick = signIn;
$('go2').onclick = changePw;
['u','p'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') signIn(); }));
['np','np2'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') changePw(); }));
</script>
</body>
</html>
